name: Deploy project website

on:
  push:
    branches: [main]
    paths: ["site/**", "ACKNOWLEDGEMENTS.md", "THIRD_PARTY_NOTICES.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Set the repository variable ENABLE_GITHUB_PAGES=true after Pages has
    # been enabled for the repository. Private repositories require a plan
    # that supports private GitHub Pages.
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website and legal notices
        run: |
          mkdir _site
          cp -R site/. _site/
          cp LICENSE _site/LICENSE.txt
          cp NOTICE ACKNOWLEDGEMENTS.md THIRD_PARTY_NOTICES.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
