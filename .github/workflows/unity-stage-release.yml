name: Unity stage desktop builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing GitHub Release tag to attach the AppImage to
        required: false
        type: string
      build_macos:
        description: Build native Apple-Silicon .app on a macOS ARM64 Unity runner
        required: false
        default: false
        type: boolean
      build_windows:
        description: Build Windows x64 on a Windows Unity runner
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  unity-linux-stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject media and local runtime data
        run: bash scripts/release/verify-no-media.sh
      - name: Build Unity Linux player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: src/Karaoke.Stage.Unity
          unityVersion: auto
          targetPlatform: StandaloneLinux64
          buildMethod: NeonStage.Stage.Editor.NeonStageAndroidBuild.BuildLinux
      - name: Package Stage AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          NEONSTAGE_SKIP_UNITY_BUILD=1 scripts/release/build-stage-appimage.sh "$PWD/NeonStage-Stage-x86_64.AppImage"
          sha256sum NeonStage-Stage-x86_64.AppImage > SHA256SUMS-Stage
      - uses: actions/upload-artifact@v4
        with:
          name: neon-stage-unity-linux
          path: |
            NeonStage-Stage-x86_64.AppImage
            SHA256SUMS-Stage
      - name: Attach to existing GitHub Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            NeonStage-Stage-x86_64.AppImage
            SHA256SUMS-Stage

  unity-macos-stage:
    if: inputs.build_macos
    runs-on: [self-hosted, macOS, ARM64, unity]
    steps:
      - uses: actions/checkout@v4
      - name: Reject media and local runtime data
        run: bash scripts/release/verify-no-media.sh
      - name: Build native Apple-Silicon Stage
        run: scripts/macos/build-unity-stage-macos.sh
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "src/Karaoke.Stage.Unity/Builds/macOS/NeonStage Karaoke.app" NeonStage-Stage-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neon-stage-unity-macos-arm64
          path: NeonStage-Stage-macOS-arm64.zip

  unity-windows-stage:
    if: inputs.build_windows
    runs-on: [self-hosted, Windows, X64, unity]
    steps:
      - uses: actions/checkout@v4
      - name: Reject media and local runtime data
        shell: bash
        run: bash scripts/release/verify-no-media.sh
      - name: Build Windows x64 Stage
        shell: pwsh
        run: scripts/windows/build-unity-stage-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: neon-stage-unity-windows-x64
          path: src/Karaoke.Stage.Unity/Builds/Windows/
