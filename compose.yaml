name: neon-stage

services:
  server:
    image: ${NEON_STAGE_SERVER_IMAGE:-neon-stage-server:local}
    build:
      context: .
      dockerfile: src/Karaoke.Server/Dockerfile
    container_name: neon-stage-server
    user: "${NEON_STAGE_UID:-1000}:${NEON_STAGE_GID:-1000}"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5274
      DOTNET_ENVIRONMENT: Production
      Karaoke__LibraryPath: /library
      Karaoke__DatabasePath: /data/karaoke.db
      Karaoke__PublicBaseUrl: ${NEON_STAGE_PUBLIC_URL:-http://cloud.hdvtec.de:5274}
      Online__Enabled: ${ONLINE_ENABLED:-false}
      Online__Provider: LiveKit
      Online__ServerUrl: ${LIVEKIT_URL:-}
      Online__ApiKey: ${LIVEKIT_API_KEY:-}
      Online__ApiSecret: ${LIVEKIT_API_SECRET:-}
      Online__RoomPrefix: ${LIVEKIT_ROOM_PREFIX:-neonstage-}
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Spotify__RedirectUri: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:5274/api/spotify/callback}
      Qobuz__Enabled: ${QOBUZ_ENABLED:-false}
      Qobuz__AppId: ${QOBUZ_APP_ID:-}
      Qobuz__AppSecret: ${QOBUZ_APP_SECRET:-}
      Qobuz__UserAuthToken: ${QOBUZ_USER_AUTH_TOKEN:-}
      Qobuz__FormatId: ${QOBUZ_FORMAT_ID:-6}
      Qobuz__ApiBaseUrl: ${QOBUZ_API_BASE_URL:-https://www.qobuz.com/api.json/0.2}
      Usdb__Enabled: ${USDB_ENABLED:-true}
      Usdb__BaseUrl: ${USDB_BASE_URL:-https://usdb.eu}
      Usdb__CachePath: /data/usdb-cache
      Usdb__MaximumDurationDifferenceSeconds: ${USDB_MAX_DURATION_DIFFERENCE_SECONDS:-10}
      Usdb__Animux__Enabled: ${USDB_ANIMUX_ENABLED:-true}
      Usdb__Animux__BaseUrl: ${USDB_ANIMUX_BASE_URL:-https://usdb.animux.de}
      Usdb__Animux__Username: ${USDB_ANIMUX_USERNAME:-}
      Usdb__Animux__Password: ${USDB_ANIMUX_PASSWORD:-}
      LRC_ALIGNER_URL: ${LRC_ALIGNER_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${NEON_STAGE_PORT:-5274}:5274"
    volumes:
      - type: bind
        source: ${KARAOKE_LIBRARY_PATH:?Set KARAOKE_LIBRARY_PATH in .env}
        target: /library
      - type: bind
        source: ${KARAOKE_DATA_PATH:-./data}
        target: /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5274/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
