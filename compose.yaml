name: neon-stage

services:
  server:
    image: ${NEON_STAGE_SERVER_IMAGE:-neon-stage-server:local}
    build:
      context: .
      dockerfile: src/Karaoke.Server/Dockerfile
    container_name: neon-stage-server
    user: "${NEON_STAGE_UID:-1000}:${NEON_STAGE_GID:-1000}"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5274
      DOTNET_ENVIRONMENT: Production
      Karaoke__LibraryPath: /library
      Karaoke__DatabasePath: /data/karaoke.db
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Spotify__RedirectUri: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:5274/api/spotify/callback}
      LRC_ALIGNER_URL: ${LRC_ALIGNER_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${NEON_STAGE_PORT:-5274}:5274"
    volumes:
      - type: bind
        source: ${KARAOKE_LIBRARY_PATH:?Set KARAOKE_LIBRARY_PATH in .env}
        target: /library
      - type: bind
        source: ${KARAOKE_DATA_PATH:-./data}
        target: /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5274/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
