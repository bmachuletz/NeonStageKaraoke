services:
  lyrics-aligner:
    build: .
    container_name: lyrics-aligner
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
      - ./models:/models
    environment:
      ALIGN_DEVICE: cuda
      LRC_PRE_ROLL: "0.45"
      LRC_POST_ROLL: "0.35"
      # Kleine Zeilenfenster sind robust gegen lange Songs und wiederholte
      # Refrains. Die Vollspur-ASR bleibt als unabhängige Gegenprobe aktiv.
      LRC_ALIGNMENT_MODE: "line-windows"
      # Promptfähige ASR-Modelle erhalten nur einen deduplizierten Wortschatz,
      # niemals den vollständigen Liedtext in erwarteter Reihenfolge.
      LRC_ASR_PROMPT: "true"
      LRC_ASR_MODEL: "Qwen/Qwen3-ASR-1.7B-hf"
      # Full Whisper large-v3 fits sequentially on the RTX 4070 Laptop (8 GB):
      # measured 6.26 GiB allocated / 6.62 GiB reserved for a 45 s window.
      LRC_STABLE_TS_MODEL: "large-v3"
      # Whisper and the forced aligner are deliberately processed in small,
      # sequential windows for the 8 GiB laptop GPU.
      LRC_STABLE_TS_CHUNK_SECONDS: "30"
      LRC_STABLE_TS_CHUNK_OVERLAP_SECONDS: "3"
      LRC_ALIGNMENT_BATCH_SIZE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      LRC_ASR_PROMPT_MAX_CHARS: "1600"
      LRC_STABLE_TS_PROMPT_MAX_CHARS: "700"
      # Additive Punk/Rock candidate selection. The historical path remains the
      # mandatory baseline and fallback for every job.
      LRC_ALIGNMENT_CANDIDATES: "true"
      LRC_ALIGNMENT_CANDIDATE_BLEND: "true"
      LRC_ALIGNMENT_BLEND_RATIOS: "0.10"
      LRC_ALIGNMENT_MIN_IMPROVEMENT: "0.01"
      LRC_ALIGNMENT_CANDIDATE_ORIGINAL: "false"
      # Standard vocal separation retains backing/chorus vocals which the
      # karaoke model intentionally leaves in the accompaniment. It is an
      # analysis candidate only; exported controllable stems remain karaoke.
      LRC_ALIGNMENT_CANDIDATE_ALTERNATIVE: "true"
      LRC_ALIGNMENT_ALTERNATIVE_MODEL: "model_mel_band_roformer_ep_3005_sdr_11.4360.ckpt"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
